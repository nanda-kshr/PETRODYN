services:
  mongodb:
    image: mongo:7
    container_name: petrodyn-mongodb
    command: ["mongod", "--port", "4004"]
    ports:
      - "4004:4004"
    restart: unless-stopped

  data_ingestion:
    build:
      context: ./data_ingestion
      dockerfile: Dockerfile
    container_name: petrodyn-data-ingestion
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGODB_URI=mongodb://mongodb:4004/petrodyn
      - MONGODB_DB_NAME=petrodyn
    depends_on:
      - mongodb
    restart: unless-stopped

  pump_simulator:
    build:
      context: ./pump_simulator
      dockerfile: Dockerfile
    container_name: petrodyn-pump-simulator
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - WELL_ID=BW-001
      - SIMULATION_INTERVAL_MS=1000
      - INGESTION_API_URL=http://data_ingestion:4002/api/v1/ingest
      - SIMULATE_TRANSMISSION_FAILURE=false
      - NOISE_ENABLED=true
    depends_on:
      - data_ingestion
    restart: unless-stopped

  ai_pipelines:
    build:
      context: ./ai_pipelines
      dockerfile: Dockerfile
    container_name: petrodyn-ai-pipelines
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:4004/petrodyn
      - MONGODB_DB_NAME=petrodyn
      - DATA_INGESTION_URL=http://data_ingestion:4002
      - PIPELINE_INTERVAL_SECONDS=5
      - DEFAULT_WELL_ID=BW-001
    depends_on:
      - data_ingestion
      - mongodb
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: petrodyn-dashboard
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NEXT_PUBLIC_INGESTION_WS_URL=http://localhost:4002
      - NEXT_PUBLIC_AI_API_URL=http://localhost:4000
      - NEXT_PUBLIC_SIMULATOR_API_URL=http://localhost:4001
      - NEXT_PUBLIC_WELL_ID=BW-001
    depends_on:
      - data_ingestion
      - ai_pipelines
      - pump_simulator
    restart: unless-stopped
